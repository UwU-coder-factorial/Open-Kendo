[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-kendo"
version = "0.1.0"
description = "Real-time Computer Vision & Kinematic Analysis Framework for Kendo Martial Arts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Open-Kendo Contributors" }
]
keywords = [
    "computer-vision",
    "kendo",
    "pose-estimation",
    "ki-ken-tai-ichi",
    "martial-arts",
    "kinematics",
    "dtw"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video :: Display",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "opencv-python>=4.8.0.76",
    "mediapipe>=0.10.14",
    "ultralytics>=8.2.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "fastdtw>=0.3.4",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
gpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_kendo*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
