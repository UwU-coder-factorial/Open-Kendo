# ==============================================================================
# Open-Kendo Integrated Scoring Weights & Thresholds
# Formula: Score = w_kamae * S_kamae + w_exec * S_exec + w_zanshin * S_zanshin
# ==============================================================================

# Phase 1: Pre-Attack Kamae (25%)
kamae:
  weight: 0.25
  sub_weights:
    spine_straightness: 0.40      # Straight vertical spine (|tilt| <= 3.5 deg)
    stance_and_heel: 0.35         # Feet distance and left heel slight elevation
    hand_arm_angles: 0.25         # Left fist at navel, right elbow extension

# Phase 2: Motion Execution (50%)
motion_execution:
  weight: 0.50
  sub_weights:
    kikentaichi_sync: 0.50        # Synchronicity delta between Shinai impact & Fumikomi landing
    dynamic_spine_stability: 0.30 # Spine stays upright throughout swing (no leaning)
    head_level_stability: 0.20    # Head eye-line remains parallel to ground (no tilting)
  kikentaichi_bands_ms:
    perfect: 40.0                 # <= 40 ms delta -> 100 pts
    good: 80.0                    # <= 80 ms delta -> 85 pts
    acceptable: 130.0             # <= 130 ms delta -> 65 pts
    out_of_sync: 200.0            # > 200 ms delta -> 30 pts

# Phase 3: Post-Attack Zanshin (25%)
zanshin:
  weight: 0.25
  sub_weights:
    recovery_promptness: 0.40     # Smooth recovery back to Kamae within 0.3-0.8s
    kensen_targeting: 0.35        # Tip firmly points at opponent throat/centerline
    body_balance_readiness: 0.25  # Controlled balance, ready for follow-up strike
