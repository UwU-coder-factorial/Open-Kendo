# ==============================================================================
# Open-Kendo Default Configuration
# ==============================================================================

system:
  device: "cuda"  # "cuda" | "cpu" | "mps"
  seed: 42
  debug: false

camera:
  source: 0  # Camera index or video file path (e.g., "data/raw/sample2_kendo_basics_shomen_uchi.mp4")
  width: 1280
  height: 720
  fps: 60
  auto_exposure: true

perception:
  pose_backend: "mediapipe"  # "mediapipe" | "yolo"
  mediapipe:
    model_complexity: 2      # 0: Lite, 1: Full, 2: Heavy
    min_detection_confidence: 0.7
    min_tracking_confidence: 0.7
    enable_segmentation: false
  yolo:
    model_path: "models/yolov8n-pose.pt"
    confidence_threshold: 0.6
    device: "cuda"

  shinai_tracker:
    method: "color_geometry"  # "color_geometry" | "yolo_detector" | "optical_flow"
    hsv_bounds:
      lower: [15, 60, 60]     # Bamboo yellow / grip tape HSV filter
      upper: [35, 255, 255]
    min_contour_area: 150
    track_history_length: 30

features:
  trajectory:
    buffer_size: 60           # Store last N frames of keypoints
    smoothing_method: "moving_average"  # "moving_average" | "savitzky_golay" | "kalman"
    smoothing_window: 5
  footwork:
    stomp_acceleration_threshold: 12.5  # m/s^2 or pixel velocity spike
    landing_height_tolerance: 0.05      # Normalized coordinate tolerance

lifecycle:
  min_kamae_hold_frames: 15           # Frames required to confirm steady Kamae (~250ms at 60fps)
  execution_trigger_velocity: 6.5     # Sword upward/forward velocity threshold to enter Execution
  impact_apex_window_frames: 30       # Search window for strike apex impact
  zanshin_recovery_timeout_sec: 1.5   # Max allowed time to establish post-strike Zanshin

evaluation:
  target_technique: "men"     # "men" | "kote" | "do" | "tsuki" | "suburi"
  kamae:
    max_spine_tilt_deg: 3.5           # Max allowable vertical spine tilt in Kamae
    stance_width_ratio_min: 0.22      # Min foot distance relative to body height
    stance_width_ratio_max: 0.35      # Max foot distance
  motion_execution:
    max_dynamic_spine_tilt_deg: 5.0   # Max spine deviation during swing/cut
    max_head_tilt_deg: 4.0            # Max head roll angle
    kikentaichi:
      tolerance_ms: 120.0             # Max allowable time delta between Ken & Tai
      strict_window_ms: 40.0          # Perfect score window
  zanshin:
    max_recovery_duration_sec: 0.8    # Return to Kamae within 0.8s
    max_kensen_offset_deg: 5.0        # Sword tip deviation from target
  dtw:
    reference_path: "data/gold_standards/men_kihon_sensei.npz"
    distance_metric: "euclidean"
    radius: 10

ui:
  window_name: "Open-Kendo Real-time Analysis"
  display_width: 1280
  display_height: 720
  colors:
    skeleton: [0, 255, 128]       # BGR: Light Green
    shinai: [0, 200, 255]         # BGR: Orange
    fumikomi_alert: [0, 0, 255]   # BGR: Red
    hud_bg: [25, 25, 25]          # BGR: Dark Grey
  show_skeleton: true
  show_shinai_trajectory: true
  show_hud: true
  show_fps: true
  show_lifecycle_badge: true
